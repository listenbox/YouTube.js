name: Bundle release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'listenbox/YouTube.js' && github.ref == 'refs/heads/master'
    concurrency:
      group: bundle-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: bundle-release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: jdx/mise-action@v5
        with:
          version: '2026.11.7'
          mise_toml: |
            [tools]
            node = "26.5.0"
            aube = "2.5.1"
      - name: Sign and publish the next bundle-v<ABI>.<N> release
        env:
          BUNDLE_SIGNING_SEED: ${{ secrets.BUNDLE_SIGNING_SEED }}
        run: bash .github/bundle/release.sh "$GITHUB_SHA"
